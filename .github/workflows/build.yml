name: Build Tweak

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Download iOS SDK
        run: |
          SDK_URL=$(curl -s "https://api.github.com/repos/theos/sdks/releases" \
            | python3 -c "
import sys, json
releases = json.load(sys.stdin)
for r in releases:
    for a in r['assets']:
        if 'iPhoneOS16.5' in a['name']:
            print(a['browser_download_url'])
            exit()
")
          echo "Downloading: $SDK_URL"
          curl --fail -L "$SDK_URL" -o sdk.tar.xz
          tar -xf sdk.tar.xz -C $THEOS/sdks/

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: QiangDanAuto-deb
          path: packages/*.deb
