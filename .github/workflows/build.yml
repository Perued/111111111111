name: Build Tweak

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: kabiroberai/theos-action@v1
        with:
          sdk: "https://github.com/theos/sdks/releases/download/16.5/iPhoneOS16.5.sdk.tar.xz"

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: QiangDanAuto-deb
          path: packages/*.deb
