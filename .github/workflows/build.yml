name: Build Tweak

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid

      - name: Setup Theos
        run: git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Download iOS SDK
        run: |
          gh release download \
            --repo theos/sdks \
            --pattern "iPhoneOS16.5.sdk.tar.xz" \
            --output sdk.tar.xz
          tar -xf sdk.tar.xz -C $THEOS/sdks/

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: QiangDanAuto-deb
          path: packages/*.deb
